name: Build and release Sahl Gallery
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/release.keystore
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> $GITHUB_ENV
          else
            echo "KEYSTORE_B64 not set; building with debug signing"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Test
        run: |
          set -o pipefail
          gradle testDebugUnitTest --no-daemon 2>&1 | tee test.log || {
            grep -E "^e: |error:|What went wrong|FAILED|Exception|Error:" -A2 test.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1; }
      - name: Build
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log || {
            grep -E "^e: |error:|What went wrong|Lint found|Error:" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1; }
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
      - name: Name the APK and notes
        if: github.event_name != 'pull_request'
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          cp app/build/outputs/apk/release/*.apk SahlGallery-v1.${{ github.run_number }}.apk
          printf '%s\n' "$MSG" | head -n 1 > notes.txt
      - uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: v1.${{ github.run_number }}
          name: Sahl Gallery v1.${{ github.run_number }}
          body_path: notes.txt
          files: SahlGallery-v1.${{ github.run_number }}.apk
          make_latest: true
